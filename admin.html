<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>优势测评 · 数据统计</title>
  <style>
    :root {
      --primary: #2F7D6D; --primary-dark: #1F5A4E; --primary-light: #E1F0EC;
      --accent: #D85A30; --bg: #F7F6F2; --card: #FFFFFF;
      --text: #26302D; --muted: #8A938F; --border: #E4E4DE;
      --radius: 14px; --shadow: 0 2px 12px rgba(38,48,45,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .gate { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; text-align: center; box-shadow: var(--shadow); }
    .gate input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; margin: 14px 0; text-align: center; letter-spacing: 0.1em; }
    .gate input:focus { outline: none; border-color: var(--primary); }
    .btn { display: inline-block; width: 100%; padding: 14px; border: none; border-radius: 999px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .err { color: var(--accent); font-size: 13px; min-height: 20px; margin-top: 10px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
    #dashboard { display: none; }
    .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .refresh-row .time { color: var(--muted); font-size: 12px; }
    .refresh-btn { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; text-align: center; box-shadow: var(--shadow); }
    .card .v { display: block; font-size: 24px; font-weight: 700; color: var(--primary); }
    .card .l { font-size: 12px; color: var(--muted); }
    .card.hot .v { color: var(--accent); }
    h2 { font-size: 16px; margin: 26px 0 12px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    .row .name { width: 96px; font-size: 13px; flex-shrink: 0; }
    .row .track { flex: 1; height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .row .fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s; }
    .row.dist .fill { background: var(--accent); }
    .row .val { width: 56px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px 0; }
    .d-card { border-bottom: 1px solid var(--border); padding: 12px 2px; }
    .d-card:last-child { border-bottom: none; }
    .d-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .d-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .d-dur { font-size: 12px; color: var(--muted); }
    .d-flag { font-size: 11px; border-radius: 999px; padding: 1px 8px; }
    .d-flag.ok { color: var(--primary); background: var(--primary-light); }
    .d-flag.bad { color: var(--accent); background: #FDF0EC; }
    .d-top { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .d-chip { font-size: 12px; color: #fff; background: var(--primary); border-radius: 999px; padding: 2px 10px; }
    .d-chip.first { background: var(--accent); }
    .d-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; }
    .d-s { font-size: 12px; color: #4A5450; }
    .d-s b { color: var(--primary); font-weight: 600; }
    .foot { margin-top: 40px; text-align: center; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📊 优势测评 · 数据统计</h1>
    <p class="sub">完测率 · 优势分布 · 转化漏斗 · 7 日趋势</p>

    <div class="gate" id="gate">
      <p style="font-weight:600">请输入管理口令</p>
      <input type="password" id="passcode" placeholder="管理口令" autocomplete="off">
      <button class="btn" id="btn-enter">查看数据</button>
      <p class="err" id="gate-err"></p>
      <p class="hint">数据均为匿名聚合统计，不含任何个人身份信息</p>
    </div>

    <div id="dashboard">
      <div class="refresh-row">
        <span class="time" id="refresh-time"></span>
        <button class="refresh-btn" id="btn-refresh">刷新数据</button>
      </div>

      <div class="cards">
        <div class="card"><span class="v" id="m-total">–</span><span class="l">累计完测</span></div>
        <div class="card"><span class="v" id="m-valid">–</span><span class="l">有效作答</span></div>
        <div class="card hot"><span class="v" id="m-clients">–</span><span class="l">独立访客</span></div>
        <div class="card"><span class="v" id="m-starts">–</span><span class="l">开始作答</span></div>
        <div class="card"><span class="v" id="m-rate">–</span><span class="l">完测率</span></div>
        <div class="card"><span class="v" id="m-dur">–</span><span class="l">平均用时</span></div>
      </div>

      <h2>Top1 优势分布（首优势人数）</h2>
      <div class="panel" id="dist-panel"></div>

      <h2>八域平均分（全体样本）</h2>
      <div class="panel" id="avg-panel"></div>

      <h2>转化事件</h2>
      <div class="panel" id="event-panel"></div>

      <h2>近 7 日完测趋势</h2>
      <div class="panel" id="daily-panel"></div>

      <h2>测评明细（最近 50 条）</h2>
      <div class="panel" id="detail-panel"></div>
    </div>

    <p class="foot">优势测评 H5 · 数据后台 · 仅限运营者使用</p>
  </div>

/* 优势测评 H5 - 题库数据与计分逻辑（V1.0，与《优势测评H5题库设计文档》同源） */

/* 高分解读（报告卡片用，约100-130字） */
const INTERPRETATIONS = {
  learning: "你对世界有天然的好奇心，遇到不懂的东西就想弄明白。新工具、新知识在你手里上手很快，而且你常常能把不同领域的东西串起来，形成别人没有的理解。学习对你来说不是任务，而是乐趣。需要留意的是：兴趣广泛容易浅尝辄止，把「收藏了」当成「学会了」。给你的建议是：选定一个方向深耕 90 天，让好奇心长出成果。",
  relating: "你天生把「人」放在重要位置。朋友有事第一个想到你，因为和你相处让人放松、被记得、被在乎。你擅长维护关系的小细节，也愿意主动维系，这是很多人做不到的。需要留意的是：别让「在意别人」变成「委屈自己」，学会温和地说不。你的关系力是团队里的黏合剂，也是你最重要的隐性资产。",
  executing: "你说到做到，答应的事基本都能按时交付。「悬而未决」最让你难受，所以你总有办法把事情推到闭环。别人评价你最多的词是「靠谱」——这是职场里最硬的通货。需要留意的是：埋头赶路时记得抬头看方向，别让勤快掩盖了取舍。你的执行力适合搭配一个爱出点子的搭档，你会是那个把梦想变成交付物的人。",
  creating: "你脑中的点子比别人多，也比别人新。你对「标准答案」天然不耐烦，总想试试不一样的做法；审美和表达上也有自己的风格。别人说你「脑洞大」，其实是你在看见别人看不见的可能性。需要留意的是：想得多容易做得少，给每个灵感设一个 48 小时的小验证。你的创造力适合做从 0 到 1 的事。",
  empathizing: "你对情绪的雷达格外灵敏：气氛不对你最先察觉，朋友难过时你说的安慰总是恰好戳中。你能理解和你完全不同处境的人，这让很多人觉得「被你懂」。需要留意的是：共情力强的人容易吸收别人的情绪，分清「我理解你」和「我要替你扛」，保护好自己。你是天生的倾听者，也是很好的陪伴者。",
  analyzing: "你喜欢追问「为什么」，做决定前列利弊，听别人说话时能一眼看出论证里的漏洞。复杂的问题在你眼里能拆成简单的小问题，这是稀缺的结构化思考能力。需要留意的是：别让「想清楚」拖住「开始做」，60 分的决策加上快速迭代，常常好过 100 分的等待。你的分析力是团队里防踩坑的那道保险。",
  influencing: "你天生站在人群前排：需要有人牵头时你会站出来，表达观点时别人会认真听，还能把一个想法讲得让人心动、想参与。这是影响力的本质——让事情因为有你而动起来。需要留意的是：把「说服」升级成「沟通」，给沉默的人留出空间。你的影响力适合做发起者、组织者和催化剂。",
  resilience: "认定的事你很难被劝退，被拒绝、搞砸之后也能较快满血复活。别人放弃的关口你还在，长期没有反馈的枯燥阶段你也熬得住。这种韧性是所有长期主义者最底层的能力。需要留意的是：能扛不等于该死撑，学会区分「坚持」和「固执」，该止损时果断转身。你是那种越挫越强的人。"
};

/* 趣味人设库：每个优势域对应一只灵魂动物 + 一位历史人物 */
const PERSONAS = {
  learning:    { emoji: "🦊", animal: "灵光狐狸",   animalWhy: "狐狸是森林里出了名的机灵鬼：好奇心重、上手飞快，还会把各个洞穴的情报串成自己的地图——这不就是学什么都快、还爱跨界的你吗？", figure: "达·芬奇", figureWhy: "画画、解剖、造飞行器、研究水流，达·芬奇把「什么都想学」活成了传奇。你的学习力，就是他手稿里那股停不下来的好奇。" },
  relating:    { emoji: "🐶", animal: "暖场拉布拉多", animalWhy: "拉布拉多的招牌是「见到你就摇尾巴」：忠诚、亲人、永远让人放松。朋友有事第一个想到你，就像大家总想摸摸它的头。", figure: "苏轼", figureWhy: "苏轼自称「上可陪玉皇大帝，下可陪卑田院乞儿」，一生朋友遍布三教九流。被贬到哪都能交到朋友的你，就是古代朋友圈顶流。" },
  executing:   { emoji: "🐝", animal: "靠谱小蜜蜂", animalWhy: "蜜蜂是有明确工期和交付标准的物种：采蜜、酿蜜、封盖，一步不落。你说到做到、事情必闭环，就是人群里的那只小蜜蜂。", figure: "曾国藩", figureWhy: "曾国藩打仗的秘诀是「结硬寨、打呆仗」：不玩花活，但每天推进、绝不烂尾。你身上那股把事办成的实在劲儿，和他一模一样。" },
  creating:    { emoji: "🐙", animal: "脑洞章鱼",   animalWhy: "章鱼有三颗心脏、八只触手，还会自己换伪装皮肤——在海底活得千变万化。点子多、路子野、不肯按常理出牌的你，就是它本鱼。", figure: "毕加索", figureWhy: "毕加索一辈子换了蓝色时期、粉色时期、立体主义……从不肯重复自己。你对「标准答案」的不耐烦，就是他创作时的日常表情。" },
  empathizing: { emoji: "🐘", animal: "懂心大象",   animalWhy: "大象是少数会为同伴哀悼、互相安抚的动物，隔着几公里还能用次声波「关心」彼此。你能察觉别人没说出口的情绪，同款雷达。", figure: "特蕾莎修女", figureWhy: "她说：「我们做不到伟大的事，只能带着伟大的爱做小事。」你恰好懂这句话——安慰人不靠大道理，靠正好接住对方。" },
  analyzing:   { emoji: "🦉", animal: "逻辑猫头鹰", animalWhy: "猫头鹰站在树枝上，看田间的风吹草动一览无余，动口之前先看清全局。你列利弊、找漏洞、拆问题，就是它的分析视角。", figure: "诸葛亮", figureWhy: "隆中对还没出山，就已经把天下大势拆成了三块。你做决定前那种「先摆事实再下判断」的架势，很有点卧龙看地图的意思。" },
  influencing: { emoji: "🦁", animal: "气场雄狮",   animalWhy: "狮群出发时，走在最前面的一定是那头敢做决定的狮子。需要有人牵头时你会站出来，别人还会认真听你说话——狮吼功自带。", figure: "丘吉尔", figureWhy: "在最黑暗的时刻，他用一段演讲把整个国家的心气重新点燃。你把一个想法讲得让人想参与的能力，就是这种「语言的点火器」。" },
  resilience:  { emoji: "🐫", animal: "沙漠骆驼",   animalWhy: "骆驼不怕路远，不怕水草稀少，认准方向就能横穿沙漠。别人放弃的关口你还在走、还能扛，同款耐力和钝感力。", figure: "玄奘", figureWhy: "一个人、十七年、五万里，取回真经。认定的事很难被劝退的你，走的就是玄奘那条「长期主义」的路。" }
};

/* 计分核心：按题库文档 5.1-5.3 规则实现（对异常作答值做消毒，防止 NaN/null 扩散） */
function computeResult(answers, meta) {
  const warnings = [];
  // 效度预警
  if ((answers[57] || 0) >= 4) warnings.push("Q57 社会期许");
  if ((answers[60] || 0) >= 4) warnings.push("Q60 作答态度");
  if (answers[58] && answers[22] && Math.abs(answers[58] - answers[22]) >= 2) warnings.push("Q58 一致性");
  if (answers[59] && answers[19] && Math.abs(answers[59] - answers[19]) >= 2) warnings.push("Q59 一致性");
  if (meta && meta.durationSec != null && meta.durationSec < 120) warnings.push("作答过快");
  if (meta && meta.maxSameStreak != null && meta.maxSameStreak >= 10) warnings.push("连续同选项");

  const domainScores = {};
  Object.keys(DOMAINS).forEach(k => {
    const items = QUESTIONS.filter(q => q.d === k);
    let sum = 0;
    items.forEach(q => {
      const raw = Number(answers[q.id]);
      const safe = Number.isFinite(raw) ? Math.min(5, Math.max(1, raw)) : 3; // 非法值按中性 3 分处理
      sum += q.r ? (6 - safe) : safe;
    });
    domainScores[k] = sum / items.length; // 1-5 均分
  });

  const sorted = Object.keys(domainScores).sort((a, b) => domainScores[b] - domainScores[a]);
  const top5 = sorted.slice(0, 5);
  const dualCore = (domainScores[sorted[0]] - domainScores[sorted[1]]) < 0.1;

  return { domainScores, sorted, top5, dualCore, warnings, invalid: warnings.length >= 3 };
}

              ? (d.duration_sec >= 60 ? Math.floor(d.duration_sec / 60) + "分" + (d.duration_sec % 60) + "秒" : d.duration_sec + "秒")
              : "–";
            const top5 = d.top5 || [];
            const chips = top5.map(function (k, i) {
              const n = DOMAINS[k] ? DOMAINS[k].name : k;
              return '<span class="d-chip' + (i === 0 ? ' first' : '') + '">TOP' + (i + 1) + ' ' + n + '</span>';
            }).join("");
            const scores = Object.keys(DOMAINS).map(function (k) {
              const v = d.domain_scores && d.domain_scores[k] != null ? Number(d.domain_scores[k]).toFixed(1) : "–";
              return '<span class="d-s">' + DOMAINS[k].name + ' <b>' + v + '</b></span>';
            }).join("");
            const flags = (d.warnings && d.warnings.length)
              ? '<span class="d-flag bad">低质量(' + d.warnings.length + '项预警)</span>'
              : '<span class="d-flag ok">有效</span>';
            return '<div class="d-card">' +
              '<div class="d-head"><span class="d-time">' + (d.time || "") + '</span><span class="d-dur">用时 ' + dur + '</span>' + flags + '</div>' +
              '<div class="d-top">' + chips + '</div>' +
              '<div class="d-scores">' + scores + '</div>' +
              '</div>';
          }).join("");

      el("refresh-time").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN");
    }

    async function enter(passcode) {
      el("gate-err").textContent = "";
      el("btn-enter").disabled = true;
      el("btn-enter").textContent = "加载中…";
      try {
        const s = await loadStats(passcode);
        try { localStorage.setItem(PASSCODE_KEY, passcode); } catch (e) {}
        el("gate").style.display = "none";
        el("dashboard").style.display = "block";
        render(s);
      } catch (e) {
        el("gate-err").textContent = e && e.code === "42501" ? "口令错误，请重试" : "加载失败，请稍后重试";
      } finally {
        el("btn-enter").disabled = false;
        el("btn-enter").textContent = "查看数据";
      }
    }

    el("btn-enter").addEventListener("click", () => enter(el("passcode").value.trim()));
    el("passcode").addEventListener("keydown", (e) => { if (e.key === "Enter") enter(el("passcode").value.trim()); });
    el("btn-refresh").addEventListener("click", () => {
      let pc = ""; try { pc = localStorage.getItem(PASSCODE_KEY) || ""; } catch (e) {}
      if (pc) { loadStats(pc).then(render).catch(() => {}); }
    });
    (function resumeSession() {
      let pc = ""; try { pc = localStorage.getItem(PASSCODE_KEY) || ""; } catch (e) {}
      if (pc) { el("passcode").value = pc; enter(pc); }
    })();
  </script>
</body>
</html>
